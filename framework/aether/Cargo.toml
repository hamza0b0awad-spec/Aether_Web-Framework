[package]
name = "aether"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-performance, ergonomic Rust web framework"

[dependencies]
aether-core = { path = "../core" }
aether-http = { path = "../http" }
aether-router = { path = "../router" }
aether-middleware = { path = "../middleware" }
aether-scheduler = { path = "../scheduler" }
aether-security = { path = "../security" }
aether-websocket = { path = "../websocket" }
aether-openapi = { path = "../openapi" }
bytes.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = "1.0"
smallvec.workspace = true
# `ring` rather than the default `aws-lc-rs`: the latter builds C through cmake, which makes a
# Windows cross-platform requirement depend on an external toolchain. `tls12` is enabled because
# ALPN alone does not make a server accept TLS 1.2 clients, and Windows/macOS installs in the
# field are not uniformly 1.3-only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Revocation material is ASN.1, and a hand-rolled parser for it is the class of code that fails
# on the input nobody tested. The parser is already in the build graph through `rcgen` (test
# certificate minting); naming it directly makes CRL parsing a declared dependency, and `verify`
# checks CRL signatures on `ring`, the backend every TLS decision in this crate already uses.
x509-parser = { version = "0.18", features = ["verify"] }
# OCSP CertId binds a response to its issuer by hashing the issuer's name and public key. RFC 6960
# mandates SHA-1 there (newer responders use SHA-256), neither rustls nor x509-parser exposes a
# digest, and inventing one is not an option — `ring` is already the crypto backend of every TLS
# decision in this crate.
ring = "0.17"
# 0.4.20 is the floor, not a preference: it carries the RUSTSEC-2026-0258 fix (excessive small
# DATA frames, patched in 0.4.16) *and* the shutdown race that a GOAWAY-on-drop server hits, plus
# duplicate-content-length rejection. Re-implementing HPACK, flow control and the stream state
# machine here would mean shipping an unreviewed protocol parser as the framework's public face.
h2 = "0.4.20"
# Named directly because it is the type vocabulary `h2` speaks (`HeaderMap`, `StatusCode`,
# `Request`/`Response`). Depending on it transitively would make the frontend's types belong to a
# crate the framework does not declare.
http = "1"

[features]
default = []

[dev-dependencies]
# Test-only certificate minting (a CA and a leaf per run) so no key material is committed and
# no fixture certificate can expire. `ring` keeps it on the same crypto backend as the server.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# rcgen states CRL issue times as `time::OffsetDateTime` values; the tests build those relative
# to the clock so a freshness rule can be driven in both directions without committing fixtures.
time = "0.3"
# rcgen has no OCSP constructor, so the tests encode signed responses directly. yasna is the DER
# writer rcgen itself uses (already in the lockfile); `time` lets it encode GeneralizedTime.
yasna = { version = "0.6", features = ["time"] }
