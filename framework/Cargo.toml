[workspace]
resolver = "2"
members = [
    "core",
    "http",
    "router",
    "runtime",
    "middleware",
    "validation",
    "dependency",
    "security",
    "websocket",
    "openapi",
    "scheduler",
    "benchmarks",
    "fuzz",
    "examples",
    "tests",
    "aether",
]
default-members = ["examples"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Aether Framework Authors <engineering@aether-framework.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aether-rs/aether"
readme = "README.md"

[workspace.dependencies]
smallvec = "1.13"
bytes = "1.6"
httparse = "1.9"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
ring = "0.17"
flate2 = "1.0"
brotli = "6.0"
criterion = "0.5"
# Property tests generate the inputs and shrink every failure to a minimal case, which is what
# makes a parser/router invariant worth stating: the counterexample is small enough to keep in
# the test file. Dev-only; no runtime code depends on it.
proptest = "1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Handlers run in spawned tasks; unwinding lets `JoinError` turn a handler panic into a
# 500 for that request instead of aborting every connection in the process.
panic = "unwind"
strip = true
overflow-checks = false
